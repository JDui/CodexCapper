[package]
name = "codexcapper"
version = "2.0.0"
description = "Desktop widget for Codex usage windows"
authors = ["JDui"]
license = "GPL-3.0-or-later"
repository = "https://github.com/JDui/CodexCapper"
edition = "2021"
rust-version = "1.82"

[lib]
name = "codexcapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
notify = "8"
notify-debouncer-full = "0.5"
walkdir = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Fullscreen detection on Linux speaks the X11 protocol directly rather than
# linking Xlib, so there is no C library to find at build time and none to
# depend on at run time.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  # Where the taskbar's own buttons are is something only the shell knows, and
  # the way to ask it is UI Automation. VARIANT, which its conditions are built
  # from, is gated behind Com and Ole as well as Variant.
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
